name: Secrets and Vars
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - name: Print variable
        run: echo "Var is ${{ vars.MY_VAR }}"

      - name: Print secret (will be masked)
        run: echo "Secret is ${{ secrets.MY_SECRET }}"

      - name: Use secret as env var
        env:
          THE_SECRET: ${{ secrets.MY_SECRET }}
        run: echo "Env secret is $THE_SECRET"

      - name: GITHUB_TOKEN API call
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api repos/${{ github.repository }} --jq '.full_name'
