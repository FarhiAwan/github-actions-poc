name: Manual
on:
  workflow_dispatch:
    inputs:
      name:
        description: name
        required: true
      greeting:
        description: Greeting
        required: true
      data:
        description: Extra data
        required: false
jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ inputs.greeting }}, ${{ inputs.name }}! Data=${{ inputs.data }}"
